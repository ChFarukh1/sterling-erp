<title>Sterling Engineering · Payroll, HR and Attendance</title>

<style>
:root{--navy:#184179;--navy-d:#0f2c55;--navy-dd:#0b2245;--gold:#efaf27;--gold-l:#fff4d9;--bg:#f2f4f8;--card:#fff;--ink:#141c2b;--mut:#5f6b7c;--line:#e1e6ee;--line2:#edf0f5;--acc:#184179;--acc-bg:#e7eef8;--warn:#8a5a00;--warn-bg:#fcf1d6;--bad:#b42323;--bad-bg:#fde8e8;--ok:#1d6b34;--ok-bg:#e3f3e8;--lv:#6b46a8;--lv-bg:#efe9f8;--sh:0 1px 2px rgba(16,34,66,.06),0 1px 3px rgba(16,34,66,.04)}
